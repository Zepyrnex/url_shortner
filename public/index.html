<div class="container">

    <div class="logo">
<pre>
▞█▚
█▄█
▚█▞
</pre>
    </div>

    <h1>tinyweb</h1>

    <p class="subtitle">
        minimal url shortener
    </p>

    <input
        id="urlInput"
        type="text"
        placeholder="paste your url here...">

    <details class="advanced">

        <summary>advanced</summary>

        <input
            id="customCode"
            type="text"
            placeholder="custom alias (optional)">

        <select id="expiry">
            <option value="">never expire</option>
            <option value="1">1 day</option>
            <option value="7">7 days</option>
            <option value="30">30 days</option>
        </select>

    </details>

    <button id="shortenBtn">
        shorten
    </button>

    <div id="result" class="hidden">

        <p class="resultTitle">
            created ✓
        </p>

        <a id="shortUrl" target="_blank"></a>

        <div id="qrcode"></div>

        <div class="actions">

            <button id="copyBtn">
                copy
            </button>

            <button id="openBtn">
                open
            </button>

            <button id="downloadQR">
                qr
            </button>

        </div>

    </div>

    <details id="recentSection">

        <summary>
            recent links
        </summary>

        <div id="recentLinks"></div>

    </details>

    <div class="footer">
        node • express • prisma • railway
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
